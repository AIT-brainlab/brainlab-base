# ==========================================================
# 📡 AIT Brainlab - Declarative Network-as-Code (GitOps)
# ==========================================================
# Single Source of Truth for NetBird Groups, Policies & Setup Keys
# Synchronized via ./mgmt/vpn/sync_netbird.py [--dry-run | --apply]

# ----------------------------------------------------------
# 1. Device Groups (Clean Cluster & Role Model)
# ----------------------------------------------------------
groups:
  - name: sysadmin
    description: "SysAdmin personal laptops & workstations (full operator access)"

  - name: brainlab-cluster
    description: "On-premise CSIM compute and storage cluster (la, cairo)"

  - name: mgmt-cluster
    description: "Cloud management control plane VM (LLDAP & NetBird)"

  # Project Tags: DLMS (Driving License Management System)
  - name: prj-dlms-users
    description: "DLMS project researchers and operators"

  - name: prj-dlms-servers
    description: "DLMS application, database, and backend Docker host VM"

  # External Infrastructure Tags: CSIM Printers
  - name: csim-printers
    description: "CSIM Department printers and print server resources"

# ----------------------------------------------------------
# 2. Zero-Trust Access Control Policies
# ----------------------------------------------------------
policies:
  # 1. SysAdmin administrative access to core lab infrastructure and clusters
  - name: SysAdmin-Infra-Access
    description: "Administrative access to CSIM on-prem cluster, management plane, and routed LAN resources"
    enabled: true
    rules:
      - name: sysadmin-infra-rules
        action: accept
        protocol: all
        bidirectional: true
        sources: [sysadmin]
        destinations: [brainlab-cluster, mgmt-cluster, sysadmin]

  # 2. Local / on-prem CSIM Brainlab cluster nodes interconnectivity
  - name: Brainlab-Cluster-Mesh
    description: "Full interconnectivity between local/on-prem CSIM Brainlab resources (la & cairo)"
    enabled: true
    rules:
      - name: cluster-all-traffic
        action: accept
        protocol: all
        bidirectional: true
        sources: [brainlab-cluster]
        destinations: [brainlab-cluster]

  # 3. Brainlab cluster queries cloud LLDAP directory over encrypted WireGuard
  - name: LDAP-Directory-Access
    description: "Allow brainlab cluster to query Cloud LLDAP over encrypted WireGuard mesh"
    enabled: true
    rules:
      - name: ldap-all-traffic
        action: accept
        protocol: all
        bidirectional: true
        sources: [brainlab-cluster]
        destinations: [mgmt-cluster]

  # 4. DLMS project researchers & servers access DLMS backend VM and CCTV network resources
  - name: DLMS-Server-Access
    description: "Allow DLMS project researchers and backend servers to access DLMS backend VM and routed CCTV network resources"
    enabled: true
    rules:
      - name: dlms-backend-access
        action: accept
        protocol: all
        bidirectional: true
        sources: [prj-dlms-users, prj-dlms-servers]
        destinations: [prj-dlms-servers]

  # 5. Access to CSIM Department Printers
  - name: CSIM-Printer-Access
    description: "Access to CSIM print server (banyan) and physical printers"
    enabled: true
    rules:
      - name: csim-printer-rules
        action: accept
        protocol: all
        bidirectional: true
        sources: [sysadmin, brainlab-cluster]
        destinations: [csim-printers, sysadmin]

# ----------------------------------------------------------
# 3. Server Setup Keys (Day 1 Host Onboarding)
# ----------------------------------------------------------
setup_keys:
  - name: brainlab-cluster-enrollment
    type: reusable
    expires_in_days: 365
    auto_groups: [brainlab-cluster]
    usage_limit: 0

  - name: mgmt-vm-enrollment
    type: reusable
    expires_in_days: 365
    auto_groups: [mgmt-cluster]
    usage_limit: 0

  - name: dlms-edge-enrollment
    type: reusable
    expires_in_days: 365
    auto_groups: [prj-dlms-servers]
    usage_limit: 0

  - name: dlms-server-enrollment
    type: reusable
    expires_in_days: 365
    auto_groups: [prj-dlms-servers]
    usage_limit: 0

# ----------------------------------------------------------
# 4. Internal Mesh DNS Overrides (CNAME to MagicDNS)
# ----------------------------------------------------------
dns_zones:
  - name: "Brainlab Internal Zone"
    domain: "brain.cs.ait.ac.th"
    enabled: true
    distribution_groups: [All]
    records:
      # Dynamic CNAME: points to NetBird MagicDNS hostname (immune to WireGuard IP rotation)
      - name: "ldap.brain.cs.ait.ac.th"
        type: CNAME
        content: "brainlab-mgmt-vm.netbird.selfhosted."
        ttl: 300

      - name: "dlms-dev.brain.cs.ait.ac.th"
        type: CNAME
        content: "brainlab-proxy.netbird.selfhosted."
        ttl: 300

# ----------------------------------------------------------
# 5. Software-Defined Networks (Modern NetBird v0.25+ Architecture)
# ----------------------------------------------------------
networks:
  - name: csim-infrastructure
    description: "CSIM Server Room hypervisors and appliances"
    routers:
      - peer_name: cairo
        masquerade: true
        metric: 9999
      - peer_name: la
        masquerade: true
        metric: 9999
    resources:
      - name: proxmox-ve
        description: "CSIM Proxmox VE Web Console"
        address: "192.41.170.19/32"
        enabled: true
        groups: [sysadmin]

      - name: cairo-lan
        description: "CSIM TrueNAS Storage Node (Direct LAN IP)"
        address: "192.41.170.4/32"
        enabled: true
        groups: [sysadmin]

      - name: la-lan
        description: "CSIM GPU Compute Node (Direct LAN IP)"
        address: "192.41.170.85/32"
        enabled: true
        groups: [sysadmin]

      - name: banyan-print-server
        description: "CSIM Print Server & Domain Controller (banyan.cs.ait.ac.th)"
        address: "192.41.170.5/32"
        enabled: true
        groups: [csim-printers, sysadmin]

      - name: magnum-printer
        description: "CSIM HP LaserJet P4015x Printer Room 212 (magnum.cs.ait.ac.th)"
        address: "192.41.170.42/32"
        enabled: true
        groups: [csim-printers, sysadmin]

      - name: ricoh-printer
        description: "CSIM Ricoh IM C2000 Lobby Printer (ricoh.cs.ait.ac.th)"
        address: "192.41.170.9/32"
        enabled: true
        groups: [csim-printers, sysadmin]

  - name: dlms-cctv
    description: "On-premise RTSP camera streams for DLMS project"
    routers:
      - peer_name: dsai2
        masquerade: true
        metric: 9999
    resources:
      - name: cctv-cam-1
        description: "DLMS CCTV Camera 1"
        address: "192.168.1.2/32"
        enabled: true
        groups: [prj-dlms-users, prj-dlms-servers]
      - name: cctv-cam-2
        description: "DLMS CCTV Camera 2"
        address: "192.168.1.3/32"
        enabled: true
        groups: [prj-dlms-users, prj-dlms-servers]


