# ==========================================================
# 📡 AIT Brainlab - Declarative Network-as-Code (GitOps)
# ==========================================================
# Single Source of Truth for NetBird Groups, Policies & Setup Keys
# Synchronized via ./mgmt/vpn/sync_netbird.py [--dry-run | --apply]

# ----------------------------------------------------------
# 1. Device Groups (Composable 2-Tag Model: loc-* and tier-*)
# ----------------------------------------------------------
groups:
  # Location Tags
  - name: loc-onprem-csim
    description: "CSIM Server Room physical hardware (10GbE LAN)"
  - name: loc-onprem-lab
    description: "Physical workstations in Brainlab student room"
  - name: loc-cloud-gcp
    description: "Google Cloud Platform compute instances"
  - name: loc-cloud-aws
    description: "Amazon Web Services compute instances"

  # Role / Tier Tags
  - name: tier-servers
    description: "All GPU compute and NAS servers across all locations"
  - name: tier-storage
    description: "Central network-attached storage (TrueNAS cairo)"
  - name: tier-mgmt
    description: "Management control plane VM"
  - name: tier-operators
    description: "SysAdmin personal laptops (full god-mode access)"
  - name: tier-students
    description: "General researcher & student personal laptops"

  # Project Tags: DLMS (Driving License Management System)
  - name: prj-dlms-users
    description: "DLMS project researchers and operators"
  - name: prj-dlms-servers
    description: "DLMS application, database, and backend Docker host VM"
  - name: prj-dlms-cctv
    description: "DLMS on-prem local CCTV RTSP camera edge peer"

# ----------------------------------------------------------
# 2. Zero-Trust Access Control Policies
# ----------------------------------------------------------
policies:
  - name: Servers-Cluster-Mesh
    description: "Allow full interconnectivity between servers for distributed training & NFS"
    enabled: true
    rules:
      - name: cluster-all-traffic
        action: accept
        protocol: all
        bidirectional: true
        sources: [tier-servers]
        destinations: [tier-servers]

  - name: SysAdmin-God-Mode
    description: "Full remote administrative access for SysAdmin operators"
    enabled: true
    rules:
      - name: sysadmin-to-all
        action: accept
        protocol: all
        bidirectional: true
        sources: [tier-operators]
        destinations: [tier-servers, tier-mgmt, tier-storage]

  - name: Student-Compute-Access
    description: "Grant students access to compute services while isolating student laptops"
    enabled: true
    rules:
      - name: student-to-compute-ports
        action: accept
        protocol: tcp
        bidirectional: false
        sources: [tier-students]
        destinations: [tier-servers]
        ports: ["2222", "8888", "8000", "5000", "631"]
      - name: student-ping
        action: accept
        protocol: icmp
        bidirectional: false
        sources: [tier-students]
        destinations: [tier-servers]

  - name: LDAP-Directory-Access
    description: "Allow servers and TrueNAS storage to query Cloud LLDAP over encrypted WireGuard mesh"
    enabled: true
    rules:
      - name: ldap-all-traffic
        action: accept
        protocol: all
        bidirectional: true
        sources: [tier-servers, tier-storage]
        destinations: [tier-mgmt]

  - name: DLMS-Server-Access
    description: "Allow DLMS project researchers to access backend VM"
    enabled: true
    rules:
      - name: dlms-backend-access
        action: accept
        protocol: all
        bidirectional: true
        sources: [prj-dlms-users, tier-operators]
        destinations: [prj-dlms-servers]

  - name: DLMS-CCTV-Access
    description: "Allow DLMS users and backend VM to access CCTV RTSP streams"
    enabled: true
    rules:
      - name: dlms-cctv-access
        action: accept
        protocol: all
        bidirectional: true
        sources: [prj-dlms-servers, prj-dlms-users, tier-operators]
        destinations: [prj-dlms-cctv]

# ----------------------------------------------------------
# 3. Server Setup Keys (Day 1 Host Onboarding)
# ----------------------------------------------------------
setup_keys:
  - name: onprem-csim-enrollment
    type: reusable
    expires_in_days: 30
    auto_groups: [loc-onprem-csim, tier-servers]
    usage_limit: 0

  - name: mgmt-vm-enrollment
    type: reusable
    expires_in_days: 365
    auto_groups: [tier-mgmt]
    usage_limit: 0

  - name: truenas-storage-enrollment
    type: reusable
    expires_in_days: 365
    auto_groups: [loc-onprem-csim, tier-storage]
    usage_limit: 0

  - name: dlms-cctv-enrollment
    type: reusable
    expires_in_days: 365
    auto_groups: [prj-dlms-cctv]
    usage_limit: 0

  - name: dlms-server-enrollment
    type: reusable
    expires_in_days: 365
    auto_groups: [prj-dlms-servers]
    usage_limit: 0

# ----------------------------------------------------------
# 4. Internal Split-Horizon DNS Zones
# ----------------------------------------------------------
dns_zones:
  - name: "Brainlab Internal Zone"
    domain: "brain.cs.ait.ac.th"
    enabled: true
    distribution_groups: [All]
    records:
      - name: "ldap.brain.cs.ait.ac.th"
        type: A
        content: "100.74.72.168"
        ttl: 300
      - name: "truenas.brain.cs.ait.ac.th"
        type: A
        content: "100.74.68.117"
        ttl: 300
      - name: "cairo.brain.cs.ait.ac.th"
        type: A
        content: "100.74.68.117"
        ttl: 300

# ----------------------------------------------------------
# 5. Network Subnet Routes (Routing Peers)
# ----------------------------------------------------------
network_routes:
  - network_id: cctv-cam-1
    network: "192.168.1.2/32"
    description: "DLMS CCTV Camera 1"
    peer_name: dsai2
    masquerade: true
    enabled: true
    distribution_groups: [prj-dlms-users, prj-dlms-servers, tier-operators]

  - network_id: cctv-cam-2
    network: "192.168.1.3/32"
    description: "DLMS CCTV Camera 2"
    peer_name: dsai2
    masquerade: true
    enabled: true
    distribution_groups: [prj-dlms-users, prj-dlms-servers, tier-operators]
