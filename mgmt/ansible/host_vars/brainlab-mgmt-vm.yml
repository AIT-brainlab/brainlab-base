---
# ==========================================================
# 🖥️ Host: brainlab-mgmt-vm (GCP Compute Engine)
# ==========================================================
# Connects securely via Google Cloud IAP Zero-Trust Tunnel.
# Dynamically inherits current operator or CI/CD identity.
# ==========================================================

ansible_host: brainlab-mgmt-vm

ansible_user: "{{ lookup('env', 'ANSIBLE_USER') | default(lookup('env', 'USER'), true) }}"

ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_PRIVATE_KEY_FILE') | default('~/.ssh/google_compute_engine', true) }}"

ansible_ssh_common_args: >-
  -o ProxyCommand="gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone=asia-southeast1-a --project=ait-brainlab-mgmt"
