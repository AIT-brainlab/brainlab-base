# UID Scheme (Sorted Ascending by UID):
#   - 2xxx:   Faculty & Permanent Lab / Project Accounts
#             (2001 bci, 2002 chaklams, 2003 slwp1)
#   - 3xxx:   Alumni without Student ID
#             (3001 pasitt, 3002 aimanl, 3003 abhinavl,
#              3004 buddhabhushans, 3005 hamzak, 3006 jinayp, 3007 mokshs)
#   - 5xxx:   External Collaborators / Temporary
#   - 12xxxx: AIT Student IDs (Master / PhD)
# GID Scheme:
#   - 2001: admin (bci service account)
#   - 2002: brainlab (all researchers, faculty, students, alumni)

groups:
