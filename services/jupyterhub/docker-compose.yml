services:
  traefik:
    image: traefik:v3.7
    container_name: jupyterhub-traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme:/etc/traefik/acme
    environment:
      - HTTP_PROXY=http://192.41.170.82:3128
      - HTTPS_PROXY=http://192.41.170.82:3128
      - NO_PROXY=localhost,127.0.0.1,jupyterhub,172.16.0.0/12,10.0.0.0/8
    networks:
      - jupyterhub-net

  jupyterhub:
    build:
      context: .
      dockerfile: Dockerfile
    image: aitbrainlab/jupyterhub:5.2.1
    container_name: jupyterhub
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro
      - jupyterhub_data:/data
    env_file:
      - .env
    environment:
      - HTTP_PROXY=http://192.41.170.82:3128
      - HTTPS_PROXY=http://192.41.170.82:3128
      - NO_PROXY=localhost,127.0.0.1,jupyterhub,brainlab-mgmt-vm,100.64.0.0/10,100.103.0.0/16,172.16.0.0/12,10.0.0.0/8
    networks:
      - jupyterhub-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyterhub.rule=Host(`la.cs.ait.ac.th`)"
      - "traefik.http.routers.jupyterhub.entrypoints=websecure"
      - "traefik.http.routers.jupyterhub.tls=true"
      - "traefik.http.routers.jupyterhub.tls.certresolver=le"
      - "traefik.http.services.jupyterhub.loadbalancer.server.port=8000"

volumes:
  jupyterhub_data:

networks:
  jupyterhub-net:
    name: jupyterhub-net
