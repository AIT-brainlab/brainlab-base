services:
  example-app:
    image: httpd:alpine
    container_name: example-app
    restart: unless-stopped
    command: >
      sh -c "echo '<h1>Welcome to example.brain.cs.ait.ac.th</h1><p>Served via Two-Tier Ingress on brainlab-services (/projects/example)</p>' > /usr/local/apache2/htdocs/index.html && exec httpd-foreground"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.example.rule=Host(`example.brain.cs.ait.ac.th`)"
      - "traefik.http.routers.example.entrypoints=web"
      - "traefik.http.services.example.loadbalancer.server.port=80"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
