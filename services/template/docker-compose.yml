# 🚀 Official AIT Brainlab Web Application Deployment Template (Docker Swarm Mode)
# Deploy with: docker stack deploy -c docker-compose.yml my-app-stack

version: '3.8'

services:
  my-app:
    image: httpd:alpine
    networks:
      - brainlab-mesh
    environment:
      - TZ=Asia/Bangkok
      - HTTP_PROXY=http://192.41.170.82:3128
      - HTTPS_PROXY=http://192.41.170.82:3128
      - NO_PROXY=localhost,127.0.0.1,192.41.170.0/24,100.64.0.0/10,100.74.0.0/16,*.brain.cs.ait.ac.th
    command: >
      sh -c "echo 'welcome to my application' > /usr/local/apache2/htdocs/index.html && exec httpd-foreground"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.my-app.rule=Host(`my-app.brain.cs.ait.ac.th`)"
        - "traefik.http.routers.my-app.entrypoints=web"
        - "traefik.http.services.my-app.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  brainlab-mesh:
    external: true
