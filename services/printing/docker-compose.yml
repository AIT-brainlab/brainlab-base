version: '3.8'

services:
  # 1. Project-Level Traefik (HTTP Port 80 Ingress only — SSL offloaded by brainlab-proxy)
  traefik:
    image: traefik:v3.7
    container_name: services-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - services-net

  # 2. Remote Web Print Service
  web-print:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/ait-brainlab/web-print:latest
    container_name: web-print
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
      - HTTP_PROXY=http://192.41.170.82:3128
      - HTTPS_PROXY=http://192.41.170.82:3128
      - NO_PROXY=localhost,127.0.0.1,192.41.170.0/24,100.64.0.0/10,100.74.0.0/16,100.103.0.0/16,*.brain.cs.ait.ac.th
      - BASE_URL=https://print.brain.cs.ait.ac.th
      - PRINT_SERVER_HOST=192.41.170.5
      - PRINT_SERVER_PORT=515
      - MEMBERS_YAML_URL=https://raw.githubusercontent.com/AIT-brainlab/brainlab-base/main/mgmt/identity/members.yaml
    volumes:
      - print_spool:/tmp/spool
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-print.rule=Host(`print.brain.cs.ait.ac.th`)"
      - "traefik.http.routers.web-print.entrypoints=web"
      - "traefik.http.services.web-print.loadbalancer.server.port=8080"
    networks:
      - services-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. Example Demo Application
  example-app:
    image: httpd:alpine
    container_name: example-app
    restart: unless-stopped
    command: >
      sh -c "echo '<h1>Welcome to example.brain.cs.ait.ac.th</h1><p>Served via Two-Tier Ingress on brainlab-services</p>' > /usr/local/apache2/htdocs/index.html && exec httpd-foreground"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.example.rule=Host(`example.brain.cs.ait.ac.th`)"
      - "traefik.http.routers.example.entrypoints=web"
      - "traefik.http.services.example.loadbalancer.server.port=80"
    networks:
      - services-net

networks:
  services-net:
    driver: bridge

volumes:
  print_spool:
    driver: local
