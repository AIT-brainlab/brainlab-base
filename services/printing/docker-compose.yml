services:
  web-print:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=http://192.41.170.82:3128
        - HTTPS_PROXY=http://192.41.170.82:3128
    image: ghcr.io/ait-brainlab/web-print:latest
    container_name: web-print
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Bangkok
      - HTTP_PROXY=http://192.41.170.82:3128
      - HTTPS_PROXY=http://192.41.170.82:3128
      - NO_PROXY=localhost,127.0.0.1,192.41.170.0/24,100.64.0.0/10,100.74.0.0/16,100.103.0.0/16,*.brain.cs.ait.ac.th
      - BASE_URL=https://print.brain.cs.ait.ac.th
      - PRINT_SERVER_HOST=192.41.170.5
      - PRINT_SERVER_PORT=515
      - MEMBERS_YAML_URL=https://raw.githubusercontent.com/AIT-brainlab/brainlab-base/main/mgmt/identity/members.yaml
    volumes:
      - print_spool:/tmp/spool
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-print.rule=Host(`print.brain.cs.ait.ac.th`)"
      - "traefik.http.routers.web-print.entrypoints=web"
      - "traefik.http.services.web-print.loadbalancer.server.port=8080"
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  print_spool:
    driver: local

networks:
  traefik-net:
    external: true
