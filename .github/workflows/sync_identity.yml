name: 👥 Sync Identity GitOps (members.yaml -> LLDAP)

on:
  push:
    branches: [main]
    paths:
      - 'mgmt/identity/members.yaml'
      - 'mgmt/identity/sync_users.py'
      - '.github/workflows/sync_identity.yml'
  workflow_dispatch:

jobs:
  sync-identity:
    name: 🔄 Synchronize LLDAP Members
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Connect to NetBird Mesh
        uses: netbirdio/netbird-action@v1
        with:
          setup-key: ${{ secrets.NETBIRD_CI_SETUP_KEY }}

      - name: Run Identity Synchronization
        env:
          LLDAP_ADMIN_PASSWORD: ${{ secrets.LLDAP_ADMIN_PASSWORD }}
        run: |
          python3 mgmt/identity/sync_users.py --apply
